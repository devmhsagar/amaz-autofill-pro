<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amaz Autofill Pro</title>
    <style>
      :root {
        --bg-main: #0f172a;
        --bg-card: rgba(30, 41, 59, 0.75);
        --bg-input: #1e293b;
        --border: rgba(255, 255, 255, 0.1);
        --primary: #2563eb;
        --primary-gradient: linear-gradient(135deg, #2563eb, #1d4ed8);
        --success: #10b981;
        --warning: #f59e0b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 360px;
        font-family: var(--font);
        background: var(--bg-main);
        color: var(--text);
        padding: 16px;
        user-select: none;
      }

      /* Header */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
      }

      .brand-title {
        font-size: 16px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.3px;
      }

      .pro-badge {
        font-size: 10px;
        font-weight: 800;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        color: #fff;
        padding: 2px 7px;
        border-radius: 999px;
        letter-spacing: 0.5px;
      }

      /* Card */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
        backdrop-filter: blur(8px);
      }

      /* Detection Info */
      .info-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }

      .info-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
      }

      .status-pill {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 12px;
        background: rgba(148, 163, 184, 0.2);
        color: var(--text-muted);
      }

      .status-pill.exact {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .status-pill.template {
        background: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }

      .status-pill.none {
        background: rgba(245, 158, 11, 0.2);
        color: #fbbf24;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--text);
        margin-top: 4px;
      }

      .info-row span.val {
        font-family: monospace;
        font-weight: 600;
        color: #93c5fd;
      }

      /* Toggle Switch */
      .toggle-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .toggle-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }

      .toggle-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #334155;
        transition: 0.25s;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        transition: 0.25s;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }

      input:checked + .slider {
        background-color: var(--success);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      }

      input:checked + .slider:before {
        transform: translateX(20px);
      }

      /* Form controls */
      .field-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      select {
        width: 100%;
        padding: 9px 12px;
        background: var(--bg-input);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
        cursor: pointer;
      }

      select:focus {
        border-color: var(--primary);
      }

      /* Action Buttons */
      .btn {
        width: 100%;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
        margin-top: 8px;
      }

      .btn-primary {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 3px 10px rgba(37, 99, 235, 0.35);
      }

      .btn-primary:hover {
        opacity: 0.92;
        transform: translateY(-1px);
        box-shadow: 0 5px 14px rgba(37, 99, 235, 0.45);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: rgba(51, 65, 85, 0.6);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background: rgba(51, 65, 85, 0.9);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn-hint {
        font-size: 10px;
        color: var(--text-muted);
        text-align: center;
        margin-top: 4px;
        line-height: 1.3;
      }

      /* Footer */
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-size: 11px;
      }

      .footer a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .safe-badge {
        color: #34d399;
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="Logo" />
        <span class="brand-title">Amaz Autofill Pro</span>
      </div>
      <span class="pro-badge">PRO v3.5</span>
    </div>

    <!-- Active Tab Detection Card -->
    <div class="card" id="detectionCard">
      <div class="info-header">
        <span class="info-title">Active e-GP Tender</span>
        <span class="status-pill" id="matchBadge">Checking...</span>
      </div>
      <div class="info-row">
        <span>Tender ID:</span>
        <span class="val" id="activeTenderId">-</span>
      </div>
      <div class="info-row">
        <span>Form ID:</span>
        <span class="val" id="activeFormId">-</span>
      </div>
    </div>

    <!-- Auto-Fill Toggle Card -->
    <div class="card">
      <div class="toggle-box">
        <div>
          <div class="toggle-label">Auto-Fill on Page Load</div>
          <div class="toggle-sub">Auto-fills strictly when Tender ID matches</div>
        </div>
        <label class="switch" for="autoFillToggle">
          <input type="checkbox" id="autoFillToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Choose Form Dropdown -->
    <div class="field-group">
      <label for="formNamesDropdown">Select Saved Tender ID to Copy From:</label>
      <select id="formNamesDropdown">
        <option value="">-- Select Saved Tender ID --</option>
      </select>
    </div>

    <!-- Action Buttons -->
    <button id="fillForm" class="btn btn-primary">
      <span>⚡ Manual Auto-Fill Form</span>
    </button>
    <div class="btn-hint">Fills rates strictly from the selected Tender ID above</div>

    <button id="saveForm" class="btn btn-secondary">
      <span>💾 Save Current Form Data</span>
    </button>
    <div class="btn-hint">Saves active page rates under this Tender ID</div>

    <!-- Footer -->
    <div class="footer">
      <a id="openOptions">⚙️ Manage Saved Forms</a>
      <span class="safe-badge">● ID-Strict Protection</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
